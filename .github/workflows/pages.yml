name: Pages

# 把 site 目录发布到 GitHub Pages（GitHub 提供的静态网页托管），目前只有压测结果页面：
#   https://avaneon.github.io/nilo-server/test/perf-playCount/
# site 下的文件原样发布，网址里的路径与目录结构一致。
#
# 推送到 master 且改动了 site 目录（或本文件）时自动发布，也可以在 Actions 页面手动触发。
# 首次使用前要在仓库 Settings -> Pages 里把 Source 设为 GitHub Actions。
on:
  push:
    branches: [ master ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 发布到 Pages 需要的权限：pages 写入站点，id-token 让 Pages 确认请求确实来自本仓库的工作流
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只发布一次；正在发布时又有新的推送，排队等它发完，不中途取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 把 site 目录打包上传，作为这次要发布的内容
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
