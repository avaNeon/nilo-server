# 压测环境的 nginx：和线上一样装在被测机的宿主机上，不进容器，由压测工作流的 Start nginx 步骤启动。
# 它监听隧道地址上的 7071：k6 的请求、Prometheus 抓指标、诊断模式下载堆快照都经它转给 nilo-web；
# nilo-web 和线上一样只映射到本机的 127.0.0.1:7071。请求头与连接池照抄线上 nginx/nilo.conf 中主站接口的部分。
#
# 工作流启动前会替换两个占位符：
#   __BIND_IP__    被测机的隧道地址
#   __MAX_CONNS__  nginx 到 nilo-web 的最大连接数，同时用作连接池大小，来自工作流的输入 nginx_max_conns
#
# 与线上的差异：
#   - 只走 HTTP，不做 HTTPS，也不托管前端页面
#   - 路径不带 /api/web/ 前缀，k6 直接请求 /video/...；线上是去掉前缀后再转发，到达 nilo-web 的路径相同
#   - X-Real-IP 透传压测机发来的值（线上是 $remote_addr）。压测请求都来自同一台压测机，
#     不透传的话所有请求都是同一个 IP，会触发 IP 维度的限流（同一 IP 对同一视频 30 秒内最多 10 次）
#   - worker_connections 调到 16384，文件句柄上限调到 65535：k6 会同时保持数千条长连接
#   - 关闭访问日志：每秒数千行日志会占用被测机的 CPU 和磁盘
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx-perf.pid;
error_log /var/log/nginx/perf-error.log warn;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_timeout 65s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx 到 nilo-web 走连接池：复用 TCP 连接，不再每个请求新建一条短连接
    upstream nilo_web {
        # 共享内存区：让所有工作进程共用 max_conns 的计数，上限按全局算，而不是每个进程各算一份
        zone nilo_web 64k;
        # 同时转发中的请求最多 __MAX_CONNS__ 个（参照 Tomcat 的 200 个工作线程留出余量）。
        # nilo-web 卡顿（如全量 GC）时，超出的请求由 nginx 立即返回 502，而不是不断新开连接涌向 Tomcat：
        # 每条连接在 Tomcat 堆里占约 16 KB 读写缓冲，不设上限时卡顿 1.5 秒就会涌入数千条连接，把堆填满、引发下一次全量 GC
        server 127.0.0.1:7071 max_conns=__MAX_CONNS__;
        # 每个工作进程缓存的空闲连接数不小于上限：连接建好后一直复用，不会因池子装不下而用完即关。
        # 否则关掉的连接在 nginx 这边占着本地端口约 60 秒（TIME_WAIT），每秒新建过多就会耗尽本地端口
        keepalive __MAX_CONNS__;
        keepalive_timeout 50s;      # 空闲连接 50 秒后由 nginx 关闭，短于 Tomcat 的 60 秒，避免复用到 Tomcat 刚关掉的连接
        keepalive_requests 1000;    # 单条连接最多 1000 个请求，与 Tomcat 的 max-keep-alive-requests 一致
    }

    server {
        listen __BIND_IP__:7071;
        client_max_body_size 50m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;      # 测试环境：透传压测机发来的 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";                  # 清空 Connection 头，连接池才能复用连接

        location / { proxy_pass http://nilo_web; }

        # 仅测试环境：指标与堆快照。堆快照要先做一次全量 GC 再写出上百 MB 的文件，
        # 放宽读超时（默认 60 秒）并关闭缓冲，边收边转给压测机，不在 nginx 这边落盘
        location /actuator/ {
            proxy_pass http://nilo_web;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
