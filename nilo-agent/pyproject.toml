[project]
name = "nilo-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-redis>=0.5.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-core>=2.50.1",
    "pydantic-settings>=2.16.1",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
nilo-agent = "nilo_agent.main:run"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
