name: Perf - Play Count

# 播放统计链路的集成压测，手动触发：GitHub 仓库页面 -> Actions -> "Perf - Play Count" -> Run workflow
#
# 两台 GitHub 云主机通过 Tailscale 隧道互连：
#   - sut（被测机）：用 docker/integration 拉起中间件与微服务，灌种子数据，监控写入何时停止并对账
#   - load（压测机）：等被测机就绪后用 k6 压测，同时用 Prometheus 抓取被测机的指标
#   - report：合并两边的结果，写入本次运行的摘要页
# 被测机对外的 7071 由 nginx 接住：压测请求、Prometheus 抓指标、诊断模式下载堆快照，都与线上一样先到 nginx，再经连接池转给 nilo-web。
# 被测机只对压测机开放压测入口和只读的指标端口（由 Tailscale 访问控制规则限定），MySQL、Redis、ES 只监听被测机本机。
#
# 需要提前在仓库 Settings -> Secrets and variables -> Actions 里配置：
#   TS_OAUTH_CLIENT_ID、TS_OAUTH_SECRET  Tailscale OAuth client：权限为 Auth Keys 的 Write，标签只选 tag:perf-ci
# Tailscale 的访问控制规则里，tag:perf-sut、tag:perf-load 要归 tag:perf-ci 所有（写在 tagOwners 里）。
# 原因：工作流请求的标签必须与 client 的标签完全一致，或者归 client 的标签所有。两台机器各请求一个不同的标签，
# 所以 client 只带 tag:perf-ci，由它分别签发这两个标签。tag:perf-ci 不出现在访问规则里，本身访问不了任何机器。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '被测版本（镜像标签：perf-v0 ~ perf-v3，或提交号）'
        required: true
        default: perf-v3
      rate:
        description: '每秒请求数'
        required: true
        default: '5000'
      duration:
        description: '压测时长，如 3m'
        required: true
        default: '3m'
      warmup_rate:
        description: '预热的每秒请求数'
        required: true
        default: '1000'
      warmup_duration:
        description: '预热时长'
        required: true
        default: '30s'
      seed_count:
        description: '种子视频数量'
        required: true
        default: '100000'
      distribution:
        description: '视频分布：uniform 均匀；hot 80% 的请求集中在 1% 的视频上'
        required: true
        type: choice
        options:
          - uniform
          - hot
        default: uniform
      diagnose:
        description: '诊断模式：nilo-web 全程 JFR 录制，压测中和压测后共拍 3 张堆快照。拍快照会让服务停顿，本轮数字只用来看堆，不与其他轮次比较'
        type: boolean
        default: false
      web_memory:
        description: 'nilo-web 最大堆 / 容器内存上限，用 / 分隔；最大堆不小于 128m（初始堆固定为 128m）；默认 256m/512m 与线上一致'
        required: true
        default: '256m/512m'
      nginx_max_conns:
        description: 'nginx 到 nilo-web 同时转发中的请求上限，同时用作连接池大小；超出时 nginx 立即返回 502。默认 256（Tomcat 有 200 个工作线程）'
        required: true
        default: '256'

permissions:
  contents: read

env:
  SUT_NAME: nilo-sut-${{ github.run_id }}-${{ github.run_attempt }}
  LOAD_NAME: nilo-load-${{ github.run_id }}-${{ github.run_attempt }}
  SIGNAL_PORT: 8099
  VIDEO_ID_BASE: 900000000000

jobs:
  sut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 被测机脚本在 docker/integration/perf/sut 目录下运行，用 Prepare host 步骤建好的虚拟环境里的 Python
      PYTHON: ${{ github.workspace }}/.venv/bin/python
      RESULTS_DIR: ${{ github.workspace }}/perf-results
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:perf-sut
          hostname: ${{ env.SUT_NAME }}

      - name: Prepare host
        run: |
          sudo sysctl -w vm.max_map_count=262144
          python3 -m venv .venv
          .venv/bin/pip install -q -r docker/integration/perf/sut/requirements.txt
          mkdir -p perf-results
          # 记录机器配置：每次分到的云主机硬件可能不同，报告里显示 CPU 型号和核数，便于判断两次结果能否直接比较
          { echo "cpu: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"; echo "nproc: $(nproc)"; free -m; chronyc tracking 2>/dev/null || timedatectl; } > perf-results/sut-host.txt

      - name: Start environment
        working-directory: docker/integration
        env:
          NILO_TAG: ${{ inputs.version }}
          # 诊断模式：nilo-web 启动即开始 JFR 录制（profile 配置），JVM 退出时写出到 /diag/nilo-web.jfr（挂载到 docker/integration/diag），
          # 并记录老年代抽样对象到 GC 根的引用路径；录制最多占 500 MB 磁盘，超出时丢弃最早的部分
          NILO_WEB_DIAG_OPTS: ${{ inputs.diagnose && '-XX:StartFlightRecording=settings=profile,disk=true,maxsize=500m,dumponexit=true,path-to-gc-roots=true,filename=/diag/nilo-web.jfr' || '' }}
        run: |
          export BIND_IP=$(tailscale ip -4)
          # web_memory 形如 256m/512m：前半是 nilo-web 的最大堆，后半是容器内存上限
          IFS=/ read -r NILO_WEB_HEAP NILO_WEB_MEM_LIMIT <<< "${{ inputs.web_memory }}"
          export NILO_WEB_HEAP NILO_WEB_MEM_LIMIT
          docker compose up -d --build

      # nilo-canal-client 依赖链最长，它健康说明整套环境都已启动
      - name: Wait for services
        run: |
          for i in $(seq 1 180); do
            s=$(docker inspect -f '{{.State.Health.Status}}' nilo-canal-client 2>/dev/null || echo missing)
            [ "$s" = healthy ] && exit 0
            sleep 5
          done
          echo "服务启动超时" >&2
          docker compose -f docker/integration/docker-compose.yaml ps -a
          exit 1

      # nginx 和线上一样装在宿主机上，不进容器：监听隧道地址的 7071，经连接池转发给只映射到本机的 nilo-web。
      # 用 systemd-run 作为独立的 nginx-perf 服务运行，cAdvisor 才能单独统计它的 CPU 和内存（见 docker-compose.yaml 里 cadvisor 的参数）
      - name: Start nginx
        run: |
          command -v nginx > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nginx; }
          sudo mkdir -p /var/log/nginx
          ip=$(tailscale ip -4)
          sed -e "s/__BIND_IP__/$ip/" -e "s/__MAX_CONNS__/${{ inputs.nginx_max_conns }}/g" \
            docker/integration/nginx/nginx.conf > "$RUNNER_TEMP/nginx.conf"
          nginx_bin=$(command -v nginx)
          sudo "$nginx_bin" -t -c "$RUNNER_TEMP/nginx.conf"
          sudo systemd-run --unit=nginx-perf "$nginx_bin" -c "$RUNNER_TEMP/nginx.conf" -g 'daemon off;'
          # 确认能经 nginx 访问到 nilo-web
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://$ip:7071/actuator/info" && exit 0
            sleep 1
          done
          echo "nginx 未能转发到 nilo-web" >&2
          sudo cat /var/log/nginx/perf-error.log >&2 || true
          exit 1

      - name: Seed videos
        working-directory: docker/integration/perf/sut
        run: $PYTHON seed_videos.py --count ${{ inputs.seed_count }}

      - name: Wait for ES sync
        working-directory: docker/integration/perf/sut
        run: $PYTHON wait_for_es_sync.py --count ${{ inputs.seed_count }}

      # 插入种子视频会让 canal-client 发出 AI 重建向量的任务；测试环境没有 nilo-ai，清空这些队列，避免干扰压测。
      # 压测期间只更新播放量，canal-client 不会为此发 AI 任务
      - name: Purge AI index queues
        run: |
          for round in 1 2; do
            sleep 10
            for q in ai.video.index.queue ai.video.index.dlq ai.subtitle.index.queue ai.subtitle.index.dlq; do
              docker exec rabbit rabbitmqctl purge_queue "$q" || true
            done
          done
          docker stats --no-stream > perf-results/docker-stats-before.txt

      - name: Serve and monitor
        timeout-minutes: 60
        working-directory: docker/integration/perf/sut
        run: $PYTHON serve.py --bind "$(tailscale ip -4)" --port "$SIGNAL_PORT" --out "$RESULTS_DIR"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p perf-results/logs
          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "perf-results/logs/$c.log" 2>&1 || true
          done
          sudo cat /var/log/nginx/perf-error.log > perf-results/logs/nginx-error.log 2>/dev/null || true
          docker stats --no-stream > perf-results/docker-stats-after.txt || true

      # 诊断模式：正常停止 nilo-web，JVM 退出时才会写出 JFR 录制文件；计算 GC 根路径要花时间，最多等 2 分钟
      - name: Collect JFR recording
        if: always() && inputs.diagnose
        run: |
          docker stop -t 120 nilo-web || true
          mkdir -p diag
          sudo cp docker/integration/diag/nilo-web.jfr diag/ && sudo chown "$USER" diag/nilo-web.jfr || echo "没有找到 JFR 录制文件" >&2

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sut-results
          path: perf-results

      # 诊断文件很大，单独上传，report 任务不必下载
      - name: Upload JFR recording
        if: always() && inputs.diagnose
        uses: actions/upload-artifact@v4
        with:
          name: sut-diag
          path: diag

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 压测机上 Prometheus 的配置文件和数据目录，供 docker/integration/perf/load/docker-compose.yaml 使用
      PROM_CONFIG: ${{ github.workspace }}/perf-load/prometheus.yml
      PROM_DATA: ${{ github.workspace }}/prom-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:perf-load
          hostname: ${{ env.LOAD_NAME }}

      # 反复询问被测机是否就绪。被测机要拉镜像、启动、灌数据、等 ES 同步，最多等 40 分钟
      - name: Wait for SUT
        run: |
          for i in $(seq 1 240); do
            ip=$(tailscale ip -4 "$SUT_NAME" 2>/dev/null || true)
            if [ -n "$ip" ] && curl -sf -m 3 "http://$ip:$SIGNAL_PORT/verify-ready" > /dev/null; then
              echo "SUT_IP=$ip" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "被测机未就绪" >&2
          exit 1

      # 记录两台机器之间是直连还是经中继，以及往返延迟
      - name: Network check
        run: |
          mkdir -p perf-load
          tailscale ping --until-direct=false -c 10 "$SUT_IP" | tee perf-load/tailscale-ping.txt || true
          { echo "cpu: $(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"; echo "nproc: $(nproc)"; chronyc tracking 2>/dev/null || timedatectl; } > perf-load/load-host.txt

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Start Prometheus
        run: |
          sed "s/SUT_HOST/$SUT_IP/g" docker/integration/perf/load/prometheus.yml > "$PROM_CONFIG"
          mkdir -p "$PROM_DATA" && chmod 777 "$PROM_DATA"
          docker compose -f docker/integration/perf/load/docker-compose.yaml up -d

      - name: Warm up
        run: |
          k6 run -q \
            -e TARGET="http://$SUT_IP:7071" -e RATE=${{ inputs.warmup_rate }} -e DURATION=${{ inputs.warmup_duration }} \
            -e VIDEO_COUNT=${{ inputs.seed_count }} -e VIDEO_ID_BASE=$VIDEO_ID_BASE -e DISTRIBUTION=${{ inputs.distribution }} \
            -e SUMMARY_FILE=perf-load/k6-warmup.json \
            docker/integration/perf/load/load.js
          # 等预热产生的写入排空再记录起点：V1 及以后每 5 秒才把本地队列发往 MQ
          sleep 20

      # 通知被测机：要开始压测了，记下现在的数据作为起点，开始监控写入
      - name: Start SUT monitor
        run: |
          curl -sf -X POST "http://$SUT_IP:$SIGNAL_PORT/start-monitor" | tee perf-load/baseline.json
          echo "TEST_START=$(date +%s)" >> "$GITHUB_ENV"

      # 压测期间每秒记录一次压测机的 CPU，用来判断瓶颈是不是压测机自己
      - name: Load test
        run: |
          python3 docker/integration/perf/load/sample_cpu.py --out perf-load/load-cpu.csv &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          # 诊断模式：压测开始后第 60 秒、第 150 秒各拍一张堆快照。
          # Spring 的 heapdump 端点会先做一次全量 GC，快照里只剩存活对象，即真正占着堆的东西
          if [ "${{ inputs.diagnose }}" = true ]; then
            mkdir -p diag
            heap_dump() { curl -sf -m 180 -o "diag/heap-$1.hprof" "http://$SUT_IP:7071/actuator/heapdump" || echo "堆快照 $1 下载失败" >&2; }
            start=$(date +%s)
            (
              sleep 60
              heap_dump during-060s
              left=$(( start + 150 - $(date +%s) ))
              if [ "$left" -gt 0 ]; then sleep "$left"; fi
              heap_dump during-150s
            ) &
            dumper=$!
          fi
          k6 run \
            -e TARGET="http://$SUT_IP:7071" -e RATE=${{ inputs.rate }} -e DURATION=${{ inputs.duration }} \
            -e VIDEO_COUNT=${{ inputs.seed_count }} -e VIDEO_ID_BASE=$VIDEO_ID_BASE -e DISTRIBUTION=${{ inputs.distribution }} \
            -e SUMMARY_FILE=perf-load/k6-main.json \
            docker/integration/perf/load/load.js
          # 等后台的快照下载完再结束这一步
          if [ -n "${dumper:-}" ]; then wait "$dumper"; fi

      # 通知被测机：压测结束了，附带结束时刻和放行请求数，被测机据此判断写入何时停止并对账
      - name: Notify SUT
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' --data @perf-load/k6-main-brief.json "http://$SUT_IP:$SIGNAL_PORT/load-finished"

      # 诊断模式：k6 已退出、连接全部断开后再拍一张，和压测中的两张对比，差出来的就是压力带来的占用（连接、排队的请求等）。
      # 必须在索要结果之前拍：被测机交出结果后，很快就会停掉 nilo-web
      - name: Heap dump after load
        if: inputs.diagnose
        run: |
          mkdir -p diag
          sleep 10
          curl -sf -m 180 -o diag/heap-after-load.hprof "http://$SUT_IP:7071/actuator/heapdump" || echo "压测后的堆快照下载失败" >&2

      # 反复索要结果，直到被测机判定写入停止、对账完成；Prometheus 在此期间继续采集，覆盖排空过程
      - name: Wait for SUT result
        run: |
          for i in $(seq 1 200); do
            code=$(curl -s -m 5 -o perf-load/sut-result.json -w '%{http_code}' "http://$SUT_IP:$SIGNAL_PORT/result" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          echo "TEST_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Summarize metrics
        if: always()
        continue-on-error: true
        run: python3 docker/integration/perf/load/summarize_metrics.py --start "$TEST_START" --end "${TEST_END:-$(date +%s)}" --out perf-load/prom-summary.json

      - name: Archive Prometheus data
        if: always()
        run: |
          docker compose -f docker/integration/perf/load/docker-compose.yaml stop || true
          sudo tar -czf perf-load/prometheus-data.tar.gz -C "$PROM_DATA" . || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: perf-load

      # 堆快照很大，单独上传，report 任务不必下载
      - name: Upload heap dumps
        if: always() && inputs.diagnose
        uses: actions/upload-artifact@v4
        with:
          name: load-diag
          path: diag

  report:
    needs: [ sut, load ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SUT results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sut-results
          path: sut-results

      - name: Download load results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: load-results
          path: load-results

      - name: Report
        run: |
          python3 docker/integration/perf/generate_report.py --sut sut-results --load load-results \
            --title "播放统计压测：${{ inputs.version }}，${{ inputs.rate }} 次/秒，${{ inputs.duration }}，${{ inputs.distribution }}${{ inputs.web_memory != '256m/512m' && format('，nilo-web 堆/容器 {0}', inputs.web_memory) || '' }}${{ inputs.nginx_max_conns != '256' && format('，nginx 最大连接数 {0}', inputs.nginx_max_conns) || '' }}${{ inputs.diagnose && '，诊断模式（数字不与其他轮次比较）' || '' }}" \
            >> "$GITHUB_STEP_SUMMARY"
