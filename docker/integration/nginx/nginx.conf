# 压测环境的 nginx：占用被测机对外的 7071 端口，k6 的请求、Prometheus 抓指标、诊断模式下载堆快照都经它转给 nilo-web，
# 与线上一样由 nginx 接住客户端连接。请求头与连接池（upstream keepalive）照抄线上 nginx/nilo.conf 中主站接口的部分。
#
# 与线上的差异：
#   - 只走 HTTP，不做 HTTPS，也不托管前端页面
#   - 路径不带 /api/web/ 前缀，k6 直接请求 /video/...；线上是去掉前缀后再转发，到达 nilo-web 的路径相同
#   - X-Real-IP 透传压测机发来的值（线上是 $remote_addr）。压测请求都来自同一台压测机，
#     不透传的话所有请求都是同一个 IP，会触发 IP 维度的限流（同一 IP 对同一视频 30 秒内最多 10 次）
#   - worker_connections 调到 16384：k6 会同时保持数千条长连接，nginx 默认的 1024 不够
#   - 关闭访问日志：每秒数千行日志会占用被测机的 CPU 和磁盘，测完收集日志时也会过大
worker_processes auto;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_timeout 65s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx 到 nilo-web 走连接池：复用 TCP 连接，不再每个请求新建一条短连接
    upstream nilo_web {
        server nilo-web:7071;
        keepalive 32;               # 每个工作进程最多缓存 32 条空闲连接；忙时不受此限，用完多出的会关闭
        keepalive_timeout 50s;      # 空闲连接 50 秒后由 nginx 关闭，短于 Tomcat 的 60 秒，避免复用到 Tomcat 刚关掉的连接
        keepalive_requests 1000;    # 单条连接最多 1000 个请求，与 Tomcat 的 max-keep-alive-requests 一致
    }

    server {
        listen 7071;
        client_max_body_size 50m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;      # 测试环境：透传压测机发来的 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";                  # 清空 Connection 头，连接池才能复用连接

        location / { proxy_pass http://nilo_web; }

        # 仅测试环境：指标与堆快照。堆快照要先做一次全量 GC 再写出上百 MB 的文件，
        # 放宽读超时（默认 60 秒）并关闭缓冲，边收边转给压测机，不在 nginx 这边落盘
        location /actuator/ {
            proxy_pass http://nilo_web;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
