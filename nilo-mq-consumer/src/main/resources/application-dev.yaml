server:
  port: 7072
spring:
  datasource:
    url: jdbc:mysql://rocky16:3306/nilo?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      cluster:
        nodes:
          - 192.168.6.10:6379
          - 192.168.6.10:6380
          - 192.168.6.10:6381
          - 192.168.6.10:6382
          - 192.168.6.10:6383
          - 192.168.6.10:6384
        max-redirects: 3  #最大重定向次数，超过这个次数还没找到数据就会报错（毕竟三台master主机，最多重定向2次就应该找到了）
      password: redis
      lettuce: #这里的配置都是默认值
        pool:
          max-active: 20 #最大活跃连接数
          max-wait: -1ms  #连接池中链接耗尽时，最大等待时间。-1ms表示无限等待，直到有连接可用
          max-idle: 10 #连接池最大空闲连接数
          min-idle: 0 #连接池最小空闲连接数
        cluster:
          refresh:
            adaptive: true  #支持集群拓扑动态感应刷新,自适应拓扑刷新是否使用所有可用的更新，默认false关闭
            period: 2000  #定时刷新
  rabbitmq:
    addresses: rocky11:5672,rocky11:5673,rocky11:5674
    username: rabbitMQAdmin
    password: rabbitMQCipher
    listener:
      simple:
        # 开启 AUTO acknowledgment 模式，消费者处理完消息后自动发送ACK给RabbitMQ
        acknowledge-mode: auto
        # 消费者的预取数量，限制一次最多拿多少条放内存，防止消费者被撑爆
        prefetch: 10
        retry:
          enabled: true      # 开启消费者本地重试
          max-attempts: 3    # 最多重试3次（本地重试）
          initial-interval: 2000ms # 每次重试间隔
          multiplier: 2.0    # 间隔指数增加
        # 重试耗尽后怎么处理？
        default-requeue-rejected: false # 重试完还是错，直接扔掉（配合死信队列）

logging:
  level:
    org.springframework.amqp.rabbit.retry.RejectAndDontRequeueRecoverer: ERROR
    com.neon.nilomqconsumer.mapper: debug
    org.mybatis: debug

mybatis:
  mapper-locations: classpath:mapper/**.xml
  configuration:
    map-underscore-to-camel-case: true

project:
  folder: E:\IdeaProjects\nilo-parent
