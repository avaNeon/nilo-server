# 照抄线上的 redis.conf，只换了密码；线上把 KEYS 改成了一个不公开的名字，这里直接禁用，对应用来说效果相同

bind 0.0.0.0
daemonize no
protected-mode no
port 6379

maxmemory 256mb
maxmemory-policy volatile-lru

logfile /data/redis-6379.log
pidfile /data/redis-6379.pid
dir /data

# RDB
dbfilename dump-6379.rdb
save 3600 1 300 20 60 10000
stop-writes-on-bgsave-error yes
rdbcompression no
rdbchecksum yes
rdb-del-sync-files no

# AOF
appendonly yes
appenddirname appendonlydir
appendfilename "appendonly-6379.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

requirepass nilo-it-redis

rename-command KEYS ""
rename-command FLUSHDB "SECURITY_FLUSHDB"
rename-command FLUSHALL "SECURITY_FLUSHALL"

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
